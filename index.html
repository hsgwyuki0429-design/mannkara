<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#2b4bbf" />
<title>STAIR MANCALA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b4bbf'/%3E%3Cpath d='M6 6h20v4H22v4h-4v4h-4v4h-4v4H6z' fill='%23ffd23f'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./src/ui/styles.css?v=202609230425" />
</head>
<body>
<div id="app">
  <header class="top">
    <div class="best"><span class="crown">👑</span><span id="best">0</span></div>
    <button id="btnSound" class="round-btn" aria-label="sound">♪</button>
  </header>
  <div class="score-wrap">
    <div id="score" class="score">0</div>
    <div id="streak" class="streak"></div>
  </div>

  <div class="stage">
    <div id="playfield" class="playfield">
      <div id="wellLayer" class="layer"></div>
      <div id="hiLayer" class="layer"></div>
      <div id="blockLayer" class="layer"></div>
      <div id="ghostLayer" class="layer"></div>
      <div id="fxLayer" class="layer"></div>
      <div id="lane" class="lane"></div>
      <div id="laneRow" class="lane"></div>
      <div id="goal" class="goal"><span>GOAL</span></div>
      <div id="pop" class="pop"></div>
    </div>
  </div>

  <div id="tray" class="tray"></div>

  <div class="footer">
    <button id="btnDebug" class="link">debug</button>
    <button id="btnRestart" class="link">restart</button>
  </div>

  <section id="debugPanel" class="debug hidden">
    <pre id="debugText"></pre>
    <div class="debug-row">
      <input id="debugHeights" value="0,0,0,0,5,0,0,0" />
      <button id="btnApplyHeights">set</button>
      <button id="btnRunChain">chain</button>
    </div>
    <p class="hint">columnHeights[0]=列1(右端) … [7]=列8(左端)。各列の下から詰めて置く</p>
  </section>
</div>

<div id="dragLayer" class="drag-layer"></div>

<div id="gameOver" class="overlay hidden">
  <div class="overlay-box">
    <p class="over-title">置ける場所がない！</p>
    <p class="over-label">SCORE</p>
    <p id="finalScore" class="over-score">0</p>
    <p id="finalBest" class="over-best"></p>
    <button id="btnRetry" class="primary">もう一度</button>
  </div>
</div>
<div id="bootError" class="boot-error hidden"></div>
<script>
  // 起動に失敗したら真っ白にせず、画面に理由を出す
  window.addEventListener('error', (e) => {
    const el = document.getElementById('bootError');
    if (!el || window.__booted) return;
    el.textContent = '読み込みに失敗しました。ページを再読み込みしてください。\n' + (e.message || '');
    el.classList.remove('hidden');
  });
</script>
<script type="module" src="./src/ui/main.js?v=202609230425"></script>
</body>
</html>
