<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>blockmancala 管理</title>
<style>
  :root{--bg:#1b2f7a;--card:#243d99;--line:rgba(150,192,255,.5);--dim:rgba(255,255,255,.65);--gold:#ffd54a;--red:#ff8a9a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:#fff;font:15px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;}
  main{max-width:620px;margin:0 auto;padding:16px 14px 60px;}
  h1{font-size:19px;margin:6px 0 4px;}
  p.note{margin:0 0 14px;color:var(--dim);font-size:13px;}
  .row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center;}
  input[type=text],input[type=password]{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:rgba(10,20,80,.5);color:#fff;font-size:16px;}
  button{padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:rgba(120,160,255,.18);color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
  button.warn{border-color:var(--red);color:var(--red);}
  button.ok{border-color:var(--gold);color:var(--gold);}
  button:disabled{opacity:.5;cursor:default;}
  label{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:13px;}
  #msg{min-height:1.4em;color:var(--gold);font-size:13px;}
  #msg.err{color:var(--red);}
  ol{list-style:none;margin:10px 0;padding:0;}
  li{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;align-items:center;}
  li.hid{outline:1.5px solid var(--red);}
  .no{grid-row:1/3;text-align:center;font-weight:800;color:var(--dim);}
  .name{font-weight:800;word-break:break-all;}
  .sub{color:var(--dim);font-size:12px;}
  .tag{color:var(--red);font-weight:800;font-size:12px;margin-left:6px;}
  li button{grid-row:1/3;grid-column:3;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<main>
  <h1>blockmancala 管理</h1>
  <p class="note">不適切な名前を「隠す」ためのページです。隠した名前は、ほかの人には ＊＊＊ と出ます（本人の画面には本人の名前のまま出ます）。名前を書き換えることはできません。</p>

  <section id="login">
    <div class="row">
      <input id="key" type="password" autocomplete="off" placeholder="合言葉（ADMIN_KEY）" />
      <button id="go" class="ok">ひらく</button>
    </div>
  </section>

  <section id="panel" class="hidden">
    <div class="row">
      <input id="q" type="text" placeholder="名前で探す" maxlength="40" />
      <label><input id="onlyHidden" type="checkbox" />隠しているものだけ</label>
      <select id="season"><option value="2">シーズン2</option><option value="1">シーズン1</option></select>
    </div>
    <div id="msg"></div>
    <ol id="list"></ol>
    <div class="row"><button id="more" class="hidden">もっと見る</button><button id="out">閉じる（合言葉を忘れる）</button></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const KEY = 'blockmancala-admin-key';                 // このタブを閉じるまで（sessionStorage）
  let key = '', offset = 0, total = 0, token = 0;
  try { key = sessionStorage.getItem(KEY) || ''; } catch {}

  const say = (t, err = false) => { $('msg').textContent = t; $('msg').classList.toggle('err', err); };
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  async function api(path, opt = {}) {
    const res = await fetch('/api/admin' + path, { ...opt, headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' }, cache: 'no-store' });
    let data = null;
    try { data = await res.json(); } catch {}
    if (res.status === 401) { logout(); throw new Error('合言葉がちがいます'); }
    if (res.status === 503) throw new Error(data?.error === 'admin-disabled' ? 'ADMIN_KEY が設定されていません（16文字以上の Secret を Cloudflare に入れてください）' : 'つながりません');
    if (!res.ok) throw new Error(data?.error || `エラー ${res.status}`);
    return data;
  }
  function logout() {
    key = ''; try { sessionStorage.removeItem(KEY); } catch {}
    $('panel').classList.add('hidden'); $('login').classList.remove('hidden'); $('key').value = '';
  }
  function row(p) {
    const li = document.createElement('li');
    li.className = p.hidden ? 'hid' : '';
    li.innerHTML = `<span class="no">${p.rank ?? '–'}</span>`
      + `<span class="name">${esc(p.name)}${p.hidden ? '<span class="tag">隠し中</span>' : ''}</span>`
      + `<button class="${p.hidden ? 'ok' : 'warn'}">${p.hidden ? '戻す' : '隠す'}</button>`
      + `<span class="sub">${Number(p.score).toLocaleString('en-US')}点</span>`;
    li.querySelector('button').addEventListener('click', async (e) => {
      const b = e.currentTarget; b.disabled = true;
      try {
        await api('', { method: 'POST', body: JSON.stringify({ id: p.id, hidden: !p.hidden }) });
        p.hidden = !p.hidden;
        li.replaceWith(row(p));
        say(p.hidden ? `「${p.name}」を隠しました` : `「${p.name}」を戻しました`);
      } catch (err) { say(err.message, true); b.disabled = false; }
    });
    return li;
  }
  async function load(reset = true) {
    const my = ++token;
    if (reset) { offset = 0; $('list').replaceChildren(); }
    const qs = new URLSearchParams({ q: $('q').value.trim(), hidden: $('onlyHidden').checked ? '1' : '0', season: $('season').value, offset });
    try {
      const d = await api('?' + qs);
      if (my !== token) return;
      $('list').append(...d.players.map(row));
      offset += d.players.length; total = d.total;
      $('more').classList.toggle('hidden', offset >= total);
      say(total ? `${total}人` : '見つかりません');
    } catch (err) { if (my === token) say(err.message, true); }
  }
  async function open() {
    key = $('key').value.trim() || key;
    if (!key) return;
    try {
      const d = await api('?limit=1');
      try { sessionStorage.setItem(KEY, key); } catch {}
      $('login').classList.add('hidden'); $('panel').classList.remove('hidden');
      load();
    } catch (err) { $('login').classList.remove('hidden'); alert(err.message); }
  }
  $('go').addEventListener('click', open);
  $('key').addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); });
  let timer = 0;
  $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 250); });
  $('onlyHidden').addEventListener('change', () => load());
  $('season').addEventListener('change', () => load());
  $('more').addEventListener('click', () => load(false));
  $('out').addEventListener('click', logout);
  if (key) open();
</script>
</body>
</html>
